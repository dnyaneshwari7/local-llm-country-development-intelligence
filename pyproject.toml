[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "country-dev-intel"
version = "0.1.0"
description = "Local LLM pipeline for extracting development intelligence from UN country reports."
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "plotly>=5.20",
  "pypdf>=4.0",
  "streamlit>=1.33",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
